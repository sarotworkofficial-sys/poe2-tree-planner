<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PoE2 Tree Planner</title>
<style>
  :root {
    --bg: #0b0d10; --panel: #14181d; --line: #262c34; --text: #d9dde3; --muted: #8a93a0;
    --node: #3b424c; --edge: #232830; --alloc: #e6ad4a; --alloc-edge: #c8913a;
    --target: #ff7a45; --keystone: #6aa0ff; --notable: #59606b; --jewel: #3fbf9f; --start: #b07cff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, "Segoe UI", "Noto Sans Thai", sans-serif; }
  .app { display: grid; grid-template-columns: 320px 1fr; height: 100%; }
  aside { background: var(--panel); border-right: 1px solid var(--line); padding: 16px; overflow: auto; }
  h1 { font-size: 17px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  label { display: block; color: var(--muted); font-size: 12px; margin: 12px 0 4px; }
  select, input, button { width: 100%; background: #0f1216; color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px; font: inherit; }
  button { cursor: pointer; width: auto; }
  button.primary { background: var(--alloc); color: #1a1205; border: 0; font-weight: 600; }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { background: #2a1c12; border: 1px solid var(--target); color: #ffd2bd; border-radius: 99px;
    padding: 2px 8px 2px 10px; font-size: 12px; display: flex; gap: 6px; align-items: center; }
  .chip b { cursor: pointer; color: var(--muted); font-weight: 400; }
  .stat { display: flex; justify-content: space-between; margin-top: 14px; padding: 10px; border: 1px solid var(--line);
    border-radius: 8px; }
  .stat strong { color: var(--alloc); font-size: 18px; }
  .list { margin-top: 10px; }
  .item { padding: 8px 0; border-top: 1px solid var(--line); cursor: pointer; }
  .item .nm { font-weight: 600; }
  .item .nm.k { color: var(--keystone); } .item .nm.n { color: var(--alloc); } .item .nm.j { color: var(--jewel); }
  .item .st { color: var(--muted); font-size: 12px; }
  .warn { color: #ff9d7a; font-size: 12px; margin-top: 8px; }
  main { position: relative; overflow: hidden; }
  svg { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  svg.drag { cursor: grabbing; }
  .tip { position: absolute; pointer-events: none; background: #0f1216ee; border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; max-width: 320px; font-size: 12px; display: none; }
  .tip .nm { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
  .legend { position: absolute; right: 12px; bottom: 12px; background: #0f1216cc; border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin: 0 4px 0 10px; vertical-align: -1px; }
  .legend i:first-child { margin-left: 0; }
  .build:empty { display: none; }
  .build { margin-top: 14px; border: 1px solid #5a4422; background: #1a150d; border-radius: 8px; padding: 10px 12px; }
  .build h2 { font-size: 15px; margin: 0 0 2px; color: var(--alloc); }
  .build .src { color: var(--muted); font-size: 11px; margin-bottom: 6px; }
  .build .stage { color: #ffd9a0; font-weight: 600; margin: 8px 0 2px; }
  .build dl { margin: 0; display: grid; grid-template-columns: 74px 1fr; gap: 3px 8px; font-size: 12.5px; }
  .build dt { color: var(--muted); } .build dd { margin: 0; }
  .build .tabs { display: flex; gap: 6px; margin-top: 6px; }
  .build .tabs button { padding: 3px 8px; font-size: 12px; }
  .build .tabs button.on { background: var(--alloc); color: #1a1205; border-color: var(--alloc); }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    aside { max-height: 46vh; border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>PoE2 Tree Planner</h1>
    <div class="sub" id="ver">กำลังโหลด…</div>

    <label for="cls">คลาส</label>
    <select id="cls"></select>

    <label for="asc">Ascendancy (วงกลางผัง)</label>
    <select id="asc"></select>
    <div class="stat"><span>แต้ม Ascendancy</span><strong id="apts">0</strong></div>

    <div class="build" id="build"></div>

    <label for="q">เพิ่ม Notable / Keystone ที่อยากได้</label>
    <input id="q" list="names" placeholder="พิมพ์ชื่อ เช่น Heavy Buffer">
    <datalist id="names"></datalist>
    <div class="chips" id="chips"></div>
    <div class="warn" id="warn"></div>

    <label for="lvl">เลเวลตัวละคร (คำนวณงบแต้ม)</label>
    <select id="lvl">
      <option value="">ไม่กำหนด</option>
      <option value="30">Level 30 (~36 แต้ม)</option>
      <option value="60">Level 60 (~81 แต้ม)</option>
      <option value="85">Level 85 (~108 แต้ม)</option>
    </select>
    <div class="stat"><span>แต้ม Passive ที่ใช้</span><strong id="pts">0</strong></div>
    <div class="warn" id="budget"></div>
    <div class="row">
      <button class="primary" id="copy">คัดลอกลิงก์</button>
      <button id="clear">ล้าง</button>
      <button id="fit">ซูมพอดี</button>
    </div>

    <div class="list" id="list"></div>
  </aside>
  <main>
    <svg id="svg"><g id="ascg"></g><g id="edges"></g><g id="nodes"></g><g id="icons" pointer-events="none"></g><g id="labels" pointer-events="none"></g></svg>
    <div class="tip" id="tip"></div>
    <div class="legend"><i style="background:var(--alloc)"></i>เส้นทางที่อัพ<i style="background:var(--target)"></i>เป้าหมาย<i style="background:var(--keystone)"></i>Keystone<i style="background:var(--start)"></i>จุดเริ่มคลาส</div>
  </main>
</div>
<script>
const NS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
let T, byId = new Map(), adj = new Map(), starts = new Map(), nameIdx = new Map();
let state = { cls: "Warrior", targets: [], asc: "", ascTargets: [], ascAuto: false, build: null };  // targets: node ids
let builds = null, ascById = new Map(), ascAdj = new Map(), ascAlloc = new Set(), ascEdges = new Set();
const ASC_SCALE = 0.9;  // the Ascendancy art is 3000 units across; this keeps it inside the class-start ring
let view = { x: 0, y: 0, w: 1, h: 1 };
let allocated = new Set(), allocEdges = new Set();

const R = { s: 28, a: 34, n: 52, j: 50, k: 78, c: 90 };

async function load() {
  // no-cache: revalidate so a rebuilt tree.json / routes.json shows up without a hard refresh
  T = await (await fetch("tree.json", { cache: "no-cache" })).json();
  $("ver").textContent = `Passive tree ${T.version} · ข้อมูลจาก ${T.source}`;
  for (const n of T.nodes) { byId.set(n.id, n); adj.set(n.id, []); }
  for (const [a, b] of T.edges) { adj.get(a).push(b); adj.get(b).push(a); }
  for (const c of T.classes) for (const nm of c.names) starts.set(nm, c.start);
  const clsNames = Object.keys(T.ascendancies).filter(n => starts.has(n));
  $("cls").innerHTML = clsNames.map(n => `<option>${n}</option>`).join("");
  for (const n of T.nodes) if ("nkj".includes(n.t)) {
    const key = n.n.toLowerCase();
    if (!nameIdx.has(key)) nameIdx.set(key, []);
    nameIdx.get(key).push(n.id);
  }
  $("names").innerHTML = [...new Set(T.nodes.filter(n => "nkj".includes(n.t)).map(n => n.n))]
    .sort().map(n => `<option value="${esc(n)}">`).join("");
  try { builds = await (await fetch("builds.json", { cache: "no-cache" })).json(); } catch { builds = null; }
  drawBase();
  await readUrl();
  update(true);
}

function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function edgeKey(a, b) { return a < b ? a + "-" + b : b + "-" + a; }

function edgePath(e) {
  const A = byId.get(e[0]), B = byId.get(e[1]);
  if (!e[2]) return `M${A.x},${A.y}L${B.x},${B.y}`;
  const [cx, cy, r] = e[2];
  let d = Math.atan2(B.y - cy, B.x - cx) - Math.atan2(A.y - cy, A.x - cx);
  while (d <= -Math.PI) d += 2 * Math.PI;
  while (d > Math.PI) d -= 2 * Math.PI;
  return `M${A.x},${A.y}A${r},${r} 0 0 ${d > 0 ? 1 : 0} ${B.x},${B.y}`;
}

// Notable/Keystone art from GGG's tree export (tree.json "sprites" + node "ic" rects).
// Each icon is a nested <svg> whose viewBox crops the sprite sheet; the frame ring sits on top.
const icons = new Map();  // node id -> { img, frame }
function sprite(href, size, rect, cx, cy, d) {
  const s = document.createElementNS(NS, "svg");
  s.setAttribute("x", cx - d / 2); s.setAttribute("y", cy - d / 2);
  s.setAttribute("width", d); s.setAttribute("height", d);
  s.setAttribute("viewBox", rect.join(" "));
  const im = document.createElementNS(NS, "image");
  im.setAttribute("href", href); im.setAttribute("width", size[0]); im.setAttribute("height", size[1]);
  s.appendChild(im);
  return s;
}
function drawIcons() {
  const S = T.sprites;
  if (!S) return;
  const g = $("icons");
  for (const n of T.nodes) {
    if (!n.ic) continue;
    const icon = sprite("assets/skills-disabled.webp", S.skills, n.ic, n.x, n.y, R[n.t] * 1.9);
    const frame = sprite("assets/frame.webp", S.frame, S.frames[n.t][0], n.x, n.y, R[n.t] * (n.t === "k" ? 2.9 : 2.7));
    g.appendChild(icon); g.appendChild(frame);
    icons.set(n.id, { img: icon.firstChild, frame });
  }
}
function paintIcons() {
  const S = T.sprites;
  if (!S) return;
  for (const [id, ic] of icons) {
    const on = allocated.has(id), t = byId.get(id).t;
    ic.img.setAttribute("href", on ? "assets/skills.webp" : "assets/skills-disabled.webp");
    ic.frame.setAttribute("viewBox", S.frames[t][on ? 1 : 0].join(" "));
  }
}

function drawBase() {
  const ge = $("edges"), gn = $("nodes");
  for (const e of T.edges) {
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", edgePath(e));
    p.dataset.k = edgeKey(e[0], e[1]);
    ge.appendChild(p);
  }
  for (const n of T.nodes) {
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", n.x); c.setAttribute("cy", n.y); c.setAttribute("r", R[n.t]);
    c.dataset.id = n.id;
    gn.appendChild(c);
  }
  ge.setAttribute("fill", "none");
  drawIcons();
  const [x0, y0, x1, y1] = T.bounds;
  view = { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}

// ---- Ascendancy (drawn in the empty centre circle, like in game) ----
// Points: 2 per Ascendancy trial. Roughly 2 by level 30, 4 by 60 and all 8 by 85.
function ascBudget(level) { return !level ? 8 : level <= 30 ? 2 : level <= 60 ? 4 : 8; }
function ascList() { return Object.keys(T.asc || {}).filter(a => T.asc[a].cls === state.cls); }
function fillAscSelect() {
  $("asc").innerHTML = `<option value="">ไม่เลือก</option>` +
    ascList().map(a => `<option${builds && builds.builds[a] && builds.builds[a].top ? ` label="${esc(a)} ★"` : ""}>${esc(a)}</option>`).join("");
  $("asc").value = state.asc;
}
function drawAsc() {
  const g = $("ascg"); g.innerHTML = ""; ascById = new Map(); ascAdj = new Map();
  const A = T.asc && T.asc[state.asc];
  const k = ASC_SCALE, r = 1500 * k;
  // no Ascendancy picked: show the base class art (frame Class0 = top-left 1500x1500 of every class sheet)
  const base = !A && ascList().map(a => T.asc[a].art).find(Boolean);
  const art = A ? A.art : base && [base[0], 0, 0, 1500, 1500, base[5], base[6]];
  if (art) {
    const [href, x, y, w, h, W, H] = art;
    g.appendChild(sprite(href, [W, H], [x, y, w, h], 0, 0, 2 * r));
  }
  if (!art) return;
  const dim = document.createElementNS(NS, "circle");  // darken the art so nodes stand out
  dim.setAttribute("r", r); dim.setAttribute("fill", "#000"); dim.setAttribute("fill-opacity", A ? ".35" : ".15");
  dim.setAttribute("stroke", "#5a4422"); dim.setAttribute("stroke-width", 16);
  g.appendChild(dim);
  if (!A) return;
  for (const n of A.nodes) { ascById.set(n.id, { ...n, x: n.x * k, y: n.y * k }); ascAdj.set(n.id, []); }
  const ge = document.createElementNS(NS, "g"); ge.setAttribute("id", "ascE"); g.appendChild(ge);
  for (const [a, b] of A.edges) {
    ascAdj.get(a).push(b); ascAdj.get(b).push(a);
    const A1 = ascById.get(a), B1 = ascById.get(b), p = document.createElementNS(NS, "path");
    p.setAttribute("d", `M${A1.x},${A1.y}L${B1.x},${B1.y}`); p.dataset.k = edgeKey(a, b);
    ge.appendChild(p);
  }
  const gn = document.createElementNS(NS, "g"); gn.setAttribute("id", "ascN"); g.appendChild(gn);
  const S = T.sprites;
  for (const n of ascById.values()) {
    const rr = n.t === "c" ? 60 : n.t === "n" ? 58 : 36;
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", n.x); c.setAttribute("cy", n.y); c.setAttribute("r", rr); c.dataset.aid = n.id;
    gn.appendChild(c);
    if (S && S.frames.an && (n.ic || n.t === "c")) {
      const ic = n.ic && sprite("assets/skills-disabled.webp", S.skills, n.ic, n.x, n.y, rr * 1.9);
      const fr = sprite("assets/frame.webp", S.frame, S.frames["a" + n.t][0], n.x, n.y, rr * 2.7);
      for (const el of [ic, fr]) if (el) { el.setAttribute("pointer-events", "none"); gn.appendChild(el); }
      n.icEl = ic; n.frEl = fr;
    }
  }
}
// default picks for a build: its most played Ascendancy passives, in order, while the points last
function autoAscTargets() {
  const b = builds && builds.builds[state.asc], A = T.asc && T.asc[state.asc];
  if (!b || !A) return [];
  const byName = new Map(A.nodes.map(n => [n.n.toLowerCase(), n.id]));
  const budget = ascBudget(state.level), out = [];
  // Abyssal Lich shares Lich's nodes and has no picks of its own in the snapshot
  const names = b.asc.length ? b.asc : ((A.sameAs && builds.builds[A.sameAs]) || { asc: [] }).asc;
  for (const nm of names) {
    const id = byName.get(nm.toLowerCase());
    if (!id) continue;
    const trial = solveAscFor([...out, id]);
    if (trial.size - 1 <= budget) out.push(id);
  }
  return out;
}
function solveAscFor(targets) {
  const A = T.asc && T.asc[state.asc];
  const alloc = new Set(A ? [A.start] : []);
  if (!A) return alloc;
  for (const t of targets) {
    const prev = new Map([...alloc].map(s => [s, null])), q = [...alloc];
    for (let i = 0; i < q.length && !prev.has(t); i++)
      for (const v of ascAdj.get(q[i]) || []) if (!prev.has(v)) { prev.set(v, q[i]); q.push(v); }
    if (prev.has(t)) for (let v = t; v !== null; v = prev.get(v)) alloc.add(v);
  }
  return alloc;
}
function paintAsc() {
  const A = T.asc && T.asc[state.asc], S = T.sprites;
  ascAlloc = A ? solveAscFor(state.ascTargets) : new Set();
  ascEdges = new Set();
  if (A) for (const [a, b] of A.edges) if (ascAlloc.has(a) && ascAlloc.has(b)) ascEdges.add(edgeKey(a, b));
  const ge = $("ascE"), gn = $("ascN");
  if (ge) for (const p of ge.children) {
    const on = ascEdges.has(p.dataset.k);
    p.setAttribute("stroke", on ? "var(--alloc-edge)" : "#6b5a3a"); p.setAttribute("stroke-width", on ? 30 : 12);
  }
  if (gn) for (const c of gn.querySelectorAll("circle")) {
    const n = ascById.get(+c.dataset.aid), on = ascAlloc.has(n.id);
    c.setAttribute("fill", n.t === "c" ? "var(--start)" : on ? "var(--alloc)" : "#2a2418");
    if (S && n.frEl) {
      if (n.icEl) n.icEl.firstChild.setAttribute("href", on ? "assets/skills.webp" : "assets/skills-disabled.webp");
      n.frEl.setAttribute("viewBox", S.frames["a" + n.t][on ? 1 : 0].join(" "));
    }
  }
  const used = Math.max(0, ascAlloc.size - 1), budget = ascBudget(state.level);
  $("apts").textContent = A ? `${used} / ${budget}` : "-";
  $("apts").style.color = used > budget ? "#ff9d7a" : "";
}

// ---- Build panel (?build=<Ascendancy>): skills / supports / items per level range ----
// skill=, sup=, item= (names split by |) override what builds.json says.
let override = {};
let flashMsg = "";  // one-off note (e.g. "not enough points") shown on the next update()
function buildPanel() {
  const b = state.build && builds && builds.builds[state.build];
  if (!b) { $("build").innerHTML = ""; return; }
  const L = state.level || 85, list = a => a && a.length ? a.map(esc).join(", ") : "-";
  const main = override.skill ? override.skill[0] : b.main;
  const sup = override.sup || (L <= 30 ? b.earlySup : b.sup);
  const items = override.item || [...b.uniques, ...b.weapon];
  const lvOf = n => b.req && b.req[n] ? ` (Lv ${b.req[n]})` : "";
  let skill;
  if (override.skill) skill = list(override.skill);
  else if (L <= 30) skill = b.early ? `${esc(b.early)}${lvOf(b.early)} ไปก่อน แล้วเปลี่ยนเป็น ${esc(b.main)} ตอน Lv ${b.mainLv}` : esc(b.main) + lvOf(b.main);
  else skill = esc(main) + (b.second ? ` + ${esc(b.second)}` : "");
  const stage = L <= 30 ? "Level 1-30" : L <= 60 ? "Level 31-60" : "Level 60-85";
  const tip = L <= 30 ? "เน้นเคลียร์ด่าน: Notable ใกล้จุดเริ่มก่อน" :
    L <= 60 ? "เริ่มไป Notable ไกลขึ้น (รีเซ็ตแต้มจัดใหม่ได้)" : "Endgame: เน้น Notable ไกล ๆ ที่แรงที่สุดของสาย + ป้องกัน";
  $("build").innerHTML = `<h2>Build ${esc(state.build)}${b.top ? " ★" : ""}</h2>
    <div class="src">${esc(b.class)} · สาย ${esc(b.style)} · ${esc(builds.league)} · ผู้เล่น ${esc(b.users)} คน</div>
    <div class="tabs">${[30, 60, 85].map(v => `<button data-lv="${v}" class="${v === L ? "on" : ""}">${v === 30 ? "1-30" : v === 60 ? "31-60" : "60-85"}</button>`).join("")}</div>
    <div class="stage">${stage}</div><div class="src">${tip}</div>
    <dl><dt>สกิล</dt><dd>${skill}</dd>
    <dt>Support</dt><dd>${list(sup)}</dd>
    ${b.granted.length ? `<dt>สกิลอื่น</dt><dd>${list(b.granted)}</dd>` : ""}
    <dt>Spirit</dt><dd>${list(b.spirit)}</dd>
    <dt>Ascendancy</dt><dd>${list(state.ascTargets.map(id => ascById.get(id)?.n).filter(Boolean))}</dd>
    <dt>Keystone</dt><dd>${list(b.keystone)}</dd>
    <dt>ไอเทม</dt><dd>${list(items)}</dd></dl>`;
}

// Shortest path from the allocated set to one node (BFS; other class starts are walls).
function bfsFrom(sources, goal, sorted) {
  const prev = new Map(), q = [];
  const next = sorted ? u => [...adj.get(u)].sort((a, b) => a - b) : u => adj.get(u);
  for (const s of sources) { prev.set(s, null); q.push(s); }
  const walls = new Set([...starts.values()].filter(id => id !== starts.get(state.cls)));
  for (let i = 0; i < q.length; i++) {
    const u = q[i];
    if (u === goal) {
      const path = [];
      for (let v = u; v !== null; v = prev.get(v)) path.push(v);
      return path.reverse();
    }
    for (const v of next(u)) if (!prev.has(v) && !walls.has(v)) { prev.set(v, u); q.push(v); }
  }
  return null;
}

// Greedy Steiner tree: keep linking the closest unreached target to what is already allocated.
// On a ready-made route the targets are linked in route order with sorted BFS, which
// rebuilds exactly the paths export_tree_routes.py counted (so the budget matches).
function solve() {
  const start = starts.get(state.cls), inOrder = onRoute();
  allocated = new Set([start]); allocEdges = new Set();
  const left = [...state.targets], unreachable = [];
  while (left.length) {
    let best = null, bi = -1;
    if (inOrder) { best = bfsFrom([...allocated].sort((a, b) => a - b), left[0], true); bi = 0; }
    else left.forEach((t, i) => {
      const p = bfsFrom(allocated, t);
      if (p && (!best || p.length < best.length)) { best = p; bi = i; }
    });
    if (!best) { unreachable.push(...left); break; }
    for (let i = 0; i < best.length; i++) {
      allocated.add(best[i]);
      if (i) allocEdges.add(edgeKey(best[i - 1], best[i]));
    }
    left.splice(bi, 1);
  }
  return unreachable;
}

// Pick the instance of a name nearest to the class start (some notables repeat).
function resolveName(name) {
  const ids = nameIdx.get(name.trim().toLowerCase());
  if (!ids) return null;
  if (ids.length === 1) return ids[0];
  const s = byId.get(starts.get(state.cls));
  return ids.reduce((a, b) => {
    const A = byId.get(a), B = byId.get(b);
    return Math.hypot(A.x - s.x, A.y - s.y) <= Math.hypot(B.x - s.x, B.y - s.y) ? a : b;

}

// Points at a level: 1 per level after 1, plus quest books (24 in all by the end of
// the campaign; roughly 7 by level 30 and 22 by level 60).
function budgetFor(level) {
  if (!level) return 0;
  const quest = level <= 30 ? 7 : level <= 60 ? 22 : 24;
  return level - 1 + quest;
}

function update(fit) {

  for (const p of $("edges").children) {

    const n = byId.get(+c.dataset.id), on = allocated.has(n.id);

    if (n.id === start) fill = "var(--start)";
    if (tset.has(n.id)) fill = "var(--target)";

  $("chips").innerHTML = state.targets.map(id =>

function fitTo(ids, pad, extra = []) {
  const xs = ids.map(i => byId.get(i).x).concat(extra.map(p => p[0]));
  const ys = ids.map(i => byId.get(i).y).concat(extra.map(p => p[1]));
  const x0 = Math.min(...xs) - pad, x1 = Math.max(...xs) + pad, y0 = Math.min(...ys) - pad, y1 = Math.max(...ys) + pad;
  const box = $("svg").getBoundingClientRect();
  const ar = box.width > 0 && box.height > 0 ? box.width / box.height : 1;
  let w = x1 - x0, h = y1 - y0;
  if (w / h < ar) w = h * ar; else h = w / ar;

// labels keep roughly the same on-screen size at any zoom (they used to cover nodes when zoomed in)
function setView() {
  $("svg").setAttribute("viewBox", `${view.x} ${view.y} ${view.w} ${view.h}`);
  const fs = Math.max(30, Math.min(170, view.w / 110));
  const gl = $("labels");
  gl.setAttribute("font-size", fs);
  gl.setAttribute("stroke-width", fs * 0.22);

// Short links. ?t= packs node ids as big-endian uint16 then base64url (same idea as
// GGG's own tree links); ?r= is the older name for a ready-made route.
function encodeIds(ids) {
  let bin = "";
  for (const id of ids) bin += String.fromCharCode(id >> 8, id & 255);
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

function decodeIds(s) {

    const ids = [];
    for (let i = 0; i + 1 < bin.length; i += 2) ids.push(bin.charCodeAt(i) << 8 | bin.charCodeAt(i + 1));
    return ids;
  } catch { return []; }
}
// Ready-made routes: ?class=Witch&style=Minion&level=30. routes.json (written by
// export_tree_routes.py) lists the routes in the KB plus the rules used to build them;
// any other class + style pair is built here with the same greedy steps and order.
let routes = null;
// style may combine several styles, e.g. "Bear,Fire": their Notables all count as main picks
// must = nodes the user asked for (targets=): linked first, then the style fills the rest of each budget
function computeRoute(cls, style, must = []) {
  const R = routes.rules, start = starts.get(cls), parts = style.split(",");
  const walls = new Set([...starts.values()].filter(id => id !== start));
  const main = new RegExp(parts.map(s => R.styles[s]).join("|"), "i"), shape = new RegExp(R.shape, "i");
  const shapeOk = parts.some(s => R.shapeThemes.includes(s));
  const def = new RegExp(R.defence[R.classDefence[cls] || "Armour"], "i");
  const sadj = new Map([...adj].map(([k, v]) => [k, [...v].sort((a, b) => a - b)]));
  const cands = [];
  for (const n of [...T.nodes].sort((a, b) => a.id - b.id)) {
    if (n.t !== "n") continue;
    const text = n.n + " " + n.s.join(" ");
    if (!shapeOk && shape.test(text)) continue;
    if (main.test(text)) cands.push([n.id, 1]);
    else if (def.test(text)) cands.push([n.id, R.weight]);
  }
  // distance from the class start, for the "far notables" bonus (same as export_tree_routes.py)
  const d0 = new Map([[start, 0]]), q0 = [start];
  for (let i = 0; i < q0.length; i++)
    for (const v of sadj.get(q0[i])) if (!d0.has(v) && !walls.has(v)) { d0.set(v, d0.get(q0[i]) + 1); q0.push(v); }
  const dmax = Math.max(1, ...cands.map(([c]) => d0.get(c) || 0));
  const stages = {};
  // every level range is its own tree (respec between ranges); must-have nodes go in first
  for (const [level, budget] of R.stages) {
    const alloc = new Set([start]), ids = [], far = (R.far || {})[String(level)] || 0;
    for (const m of must) {
      const path = bfsFrom([...alloc].sort((a, b) => a - b), m, true);
      if (path) { path.forEach(v => alloc.add(v)); ids.push(m); }
    }
    for (;;) {
      const order = [...alloc].sort((a, b) => a - b), prev = new Map(order.map(s => [s, null]));
      for (let i = 0; i < order.length; i++)
        for (const v of sadj.get(order[i])) if (!prev.has(v) && !walls.has(v)) { prev.set(v, order[i]); order.push(v); }
      let best = null;
      for (const [c, w] of cands) {
        if (alloc.has(c) || !prev.has(c)) continue;
        const path = [];
        for (let v = c; !alloc.has(v); v = prev.get(v)) path.push(v);
        if (alloc.size - 1 + path.length > budget) continue;
        const score = path.length * w / (1 + far * (d0.get(c) || 0) / dmax);
        if (!best || score < best[0]) best = [score, c, path];
      }
      if (!best) break;
      for (const v of best[2]) alloc.add(v);
      ids.push(best[1]);
    }
    stages[String(level)] = [...ids];
  }

}
// accepts any case and spaces ("melee mace", "bear, fire"); returns null for unknown styles
// The bot sometimes invents style names (e.g. "Elemental"), so common words map to real
// styles, unknown words are dropped, and if nothing is left the class's first ready-made
// route is used (with a warning) instead of showing an empty tree.
const STYLE_ALIAS = {
  elemental: "Lightning,Cold,Fire", element: "Lightning,Cold,Fire", spell: "Lightning,Cold,Fire",
  caster: "Lightning,Cold,Fire", mage: "Lightning,Cold,Fire", ice: "Cold", frost: "Cold",
  freeze: "Cold", shock: "Lightning", thunder: "Lightning", storm: "Lightning", ignite: "Fire",
  burn: "Fire", poison: "Chaos", melee: "MeleeMace", mace: "MeleeMace", strike: "MeleeMace",
  hammer: "Slam", archer: "Bow", ranged: "Bow", projectile: "Bow", grenade: "Crossbow",
  summon: "Minion", minions: "Minion", companion: "Minion", crit: "Critical",
  staff: "Quarterstaff", unarmed: "Quarterstaff", shapeshifter: "Shapeshift", wolf: "Shapeshift",
};
let styleNote = "";
function normStyle(style, cls) {
  styleNote = "";
  if (!routes || !style) return null;
  const names = Object.keys(routes.rules.styles), byLower = new Map(names.map(n => [n.toLowerCase(), n]));
  const out = [], unknown = [];
  for (const raw of style.split(",")) {
    const k = raw.replace(/\s+/g, "").toLowerCase();
    if (!k) continue;
    const hit = byLower.get(k) || (STYLE_ALIAS[k] && STYLE_ALIAS[k].split(","));
    if (hit) out.push(...[].concat(hit)); else unknown.push(raw.trim());
  }
  if (!out.length) {
    const first = Object.values(routes.routes).find(r => r.class === cls);
    if (!first) return null;
    out.push(first.theme.replace(/ /g, ""));
    styleNote = `ไม่รู้จักสาย "${style}" จึงแสดงสาย ${out[0]} แทน (สายที่มี: ${names.join(", ")})`;
  } else if (unknown.length) styleNote = `ไม่รู้จักสาย: ${unknown.join(", ")} (ข้ามไป)`;
  return [...new Set(out)].join(",");
}
function routeStages(cls, style, must = []) {
  if (!style || !starts.has(cls)) return null;
  const known = !must.length && routes.routes[`${cls}-${style}`];
  return known ? known.stages : computeRoute(cls, style, must);
}
// keep class+style in the URL only while the tree still matches that route exactly
function onRoute() {
  const st = state.route && state.route.cls === state.cls && state.route.stages[String(state.level)];
  return st && st.length === state.targets.length && st.every((id, i) => id === state.targets[i]);
}

async function readUrl() {
  const p = new URLSearchParams(location.search);
  let usedRoute = false;
  // ?build=<Ascendancy>&level=N: class, style and Ascendancy picks come from builds.json
  if (p.get("build")) {
    const want = p.get("build").trim().toLowerCase();
    const key = builds && Object.keys(builds.builds).find(k => k.toLowerCase() === want);
    if (key) {
      const b = builds.builds[key];
      state.build = key;
      p.set("class", b.class);
      if (!p.get("style") && !p.get("t") && !p.get("nodes")) p.set("style", b.style);
      if (!p.get("asc")) p.set("asc", key);
    } else setTimeout(() => $("warn").textContent = "ไม่พบ Build: " + p.get("build"), 0);
  }
  override = {};
  for (const k of ["skill", "sup", "item"])
    if (p.get(k)) override[k] = p.get(k).split("|").map(s => s.trim()).filter(Boolean);
  if (p.get("r") || p.get("style")) {
    try { routes = await (await fetch("routes.json", { cache: "no-cache" })).json(); } catch { routes = null; }
    let cls = p.get("class"), style = normStyle(p.get("style"), p.get("class"));
    const old = routes && p.get("r") && routes.routes[p.get("r")];  // older ?r=Class-Style links
    if (old) { cls = old.class; style = old.theme.replace(/ /g, ""); }
    if (starts.has(cls)) state.cls = cls;
    // targets= next to style= are must-have nodes; the route is built around them
    const mustNames = (p.get("targets") || "").split("|").filter(Boolean);
    const must = mustNames.map(resolveName).filter(Boolean);
    const stages = routes && routeStages(cls, style, must);
    if (stages) {
      usedRoute = true;
      state.route = { cls, style, stages, must: mustNames.filter(n => resolveName(n)) };
      p.set("class", cls);
      const lv = parseInt(p.get("level"), 10);
      const level = stages[String(lv)] ? lv : Math.max(...Object.keys(stages).map(Number));
      p.set("level", level);
      state.targets = [...stages[String(level)]];
      const bad = mustNames.filter(n => !resolveName(n));
      const notes = [styleNote, bad.length ? "ไม่พบชื่อ: " + bad.join(", ") : ""].filter(Boolean).join(" · ");
      if (notes) setTimeout(() => $("warn").textContent = notes, 0);
    } else setTimeout(() => $("warn").textContent =
      "ไม่พบสาย: " + (p.get("style") || p.get("r")) + (routes ? " (มี: " + Object.keys(routes.rules.styles).join(", ") + ")" : ""), 0);
  }
  if (p.get("class") && starts.has(p.get("class"))) state.cls = p.get("class");
  $("cls").value = state.cls;
  const lv = parseInt(p.get("level"), 10);
  state.level = lv > 1 && lv <= 100 ? lv : 0;
  if (state.level && ![...$("lvl").options].some(o => +o.value === state.level))
    $("lvl").add(new Option(`Level ${state.level} (~${budgetFor(state.level)} แต้ม)`, state.level));
  $("lvl").value = state.level || "";
  // Ascendancy: asc=<name>, an=<base64 ids> (no an = the build's most played picks)
  fillAscSelect();
  const a = (p.get("asc") || "").trim().toLowerCase();
  state.asc = ascList().find(x => x.toLowerCase() === a) || "";
  $("asc").value = state.asc;
  drawAsc();
  const an = decodeIds(p.get("an") || "").filter(id => ascById.has(id));
  // popular picks are filled in only for a build link; a plain asc= link starts empty
  state.ascAuto = !an.length && !p.has("an") && !!state.asc && state.build === state.asc;
  state.ascTargets = state.ascAuto ? autoAscTargets() : an;
  if (usedRoute) return;
  const bad = [];
  for (const nm of (p.get("targets") || "").split("|").filter(Boolean)) {
    const id = resolveName(nm);
    if (id) { if (!state.targets.includes(id)) state.targets.push(id); } else bad.push(nm);
  }
  const extra = [...(p.get("nodes") || "").split(",").map(Number), ...decodeIds(p.get("t") || "")];
  for (const id of extra.filter(i => byId.has(i)))
    if (!state.targets.includes(id)) state.targets.push(id);
  if (bad.length) setTimeout(() => $("warn").textContent = "ไม่พบชื่อ: " + bad.join(", "), 0);
  else if (!state.targets.length && p.get("class") && !p.get("style") && !p.get("r"))
    setTimeout(() => $("warn").textContent =
      "ลิงก์นี้ยังไม่ได้เลือก node: ใส่ &style= (เช่น Bear, Slam, Minion, Lightning) หรือคลิก Notable บน Tree", 0);
}
function writeUrl() {
  let p;
  if (onRoute()) {
    p = new URLSearchParams({ class: state.cls, style: state.route.style, level: state.level });
    if (state.route.must.length) p.set("targets", state.route.must.join("|"));
  } else {

    if (state.level) p.set("level", state.level);
    if (state.targets.length) p.set("t", encodeIds(state.targets));

  if (state.build) {

    if (!state.ascAuto) p.set("an", encodeIds(state.ascTargets));

      if (n && n.t !== "c") {
        state.ascAuto = false;
        if (state.ascTargets.includes(n.id)) state.ascTargets = state.ascTargets.filter(t => t !== n.id);
        else {
          const need = solveAscFor([...state.ascTargets, n.id]).size - 1, budget = ascBudget(state.level);
          if (need > budget) flashMsg = `แต้ม Ascendancy ไม่พอ: ต้องใช้ ${need} แต้ม แต่มี ${budget} แต้ม` +
            (state.level && state.level < 85 ? ` ตอน Level ${state.level}` : "");
          else state.ascTargets = [...state.ascTargets, n.id];
        }
        update(false);
      }
    }
  }
  drag = null;
});
svg.addEventListener("wheel", e => {
  e.preventDefault();
  const box = svg.getBoundingClientRect(), f = e.deltaY > 0 ? 1.2 : 1 / 1.2;
  const mx = view.x + (e.clientX - box.left) / box.width * view.w;
  const my = view.y + (e.clientY - box.top) / box.height * view.h;
  view = { x: mx - (mx - view.x) * f, y: my - (my - view.y) * f, w: view.w * f, h: view.h * f };
  setView();
}, { passive: false });

let lastBox = "";
new ResizeObserver(() => {
  const b = svg.getBoundingClientRect(), key = `${Math.round(b.width)}x${Math.round(b.height)}`;
  if (T && b.width && b.height && key !== lastBox) { lastBox = key; update(true); }
}).observe(svg);

load();
</script>
</body>
</html>
